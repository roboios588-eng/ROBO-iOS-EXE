
name: Build ROBO iOS Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ROBO_iOS main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ROBO_iOS-Windows-EXE
          path: dist/ROBO_iOS.exe
